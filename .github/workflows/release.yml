name: Release

# Started by hand (Actions tab, or `gh workflow run Release`). release-please
# opens or updates a release pull request from the Conventional Commits on
# main, which needs the repository to allow GitHub Actions to create pull
# requests. Dispatched after that pull request is merged, it tags the version
# and creates the GitHub Release; the zip job then builds, verifies and
# attaches both zips (the GitHub one and the wordpress.org one) and their
# SHA-256 checksums, and the wporg job publishes the release to wordpress.org
# when the repository has its SVN secrets (wporg.yml).
#
# Given a tag (`gh workflow run Release --ref main -f tag=v1.1.0`), it skips
# release-please and builds, attaches and publishes the zips of that existing
# release again, for a release left without them.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release's tag, e.g. v1.1.0, to build and publish its zips again. Empty runs release-please.
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    env:
      # Optional: a token that is not the workflow's own, which release-please
      # then opens the pull request with (docs/developer/releasing.md).
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ env.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  zip:
    needs: release-please
    # Runs on a given tag too, when release-please is skipped.
    if: ${{ !cancelled() && (inputs.tag != '' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ env.TAG }}
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No template may be newer than the version released: the release is
      # left without its zip, which no store is offered, until a fix release.
      - run: pnpm release:check-templates
      # Composer's dev packages for the tests site's plugin mount; the zip
      # gets its own production install.
      - run: pnpm composer install --no-interaction --no-progress
      # wp-env's tests site runs Plugin Check on the unpacked zip.
      - run: pnpm env:start
      - run: pnpm release:zip
      # Kept beside the github zip; the update checker never downloads it.
      - run: pnpm release:zip --flavor wporg
      - name: Attach the zips and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip dist/*.zip.sha256 --clobber

  wporg:
    needs: zip
    if: ${{ !cancelled() && needs.zip.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/wporg.yml
    with:
      tag: ${{ needs.zip.outputs.tag }}
    secrets:
      WPORG_SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
      WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
